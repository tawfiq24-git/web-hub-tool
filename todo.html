<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To Do List</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #f5d6a0, #e6c48a);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Back button */
.back {
    position: absolute;
    top: 20px;
    left: 20px;
    cursor: pointer;
}

/* Card */
.container {
    background: #1e1e2f;
    padding: 25px;
    border-radius: 12px;
    width: 320px;
    color: white;
    box-shadow: 0 0 15px #000;
}

/* Heading */
h2 {
    text-align: center;
    margin-bottom: 15px;
}

/* Input */
.input-box {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

input {
    flex: 1;
    padding: 8px;
    border-radius: 5px;
    border: none;
}

button {
    padding: 8px 12px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

/* Add button */
.add {
    background: #4c7ef3;
    color: white;
}

/* Task List */
ul {
    list-style: none;
    padding: 0;
}

li {
    background: #2a2a3d;
    padding: 8px;
    margin-bottom: 8px;
    border-radius: 5px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* Completed */
.completed {
    text-decoration: line-through;
    opacity: 0.6;
}

/* Buttons */
.actions button {
    margin-left: 5px;
    font-size: 0.7rem;
}

.delete {
    color: red;
    background: transparent;
}

.edit {
    color: orange;
    background: transparent;
}

/* Footer */
.footer {
    margin-top: 10px;
    font-size: 0.8rem;
    text-align: center;
}
</style>
</head>

<body>

<div class="back" onclick="goHome()">⬅ Home</div>

<div class="container">
    <h2>📋 To Do List</h2>

    <div class="input-box">
        <input type="text" id="taskInput" placeholder="Enter task...">
        <button class="add" onclick="addTask()">Add</button>
    </div>

    <ul id="taskList"></ul>

    <div class="footer">
        Completed Nice: <span id="done">0</span> |
        Uncompleted - pls complete: <span id="undone">0</span>
    </div>
</div>

<script>
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

function save(){
    localStorage.setItem("tasks", JSON.stringify(tasks));
}

function render(){
    const list = document.getElementById("taskList");
    list.innerHTML = "";

    let done = 0;

    tasks.forEach((task, i) => {
        const li = document.createElement("li");

        li.innerHTML = `
            <span onclick="toggle(${i})" class="${task.done ? 'completed' : ''}">
                ${task.text}
            </span>
            <div class="actions">
                <button class="delete" onclick="remove(${i})">Delete</button>
                <button class="edit" onclick="edit(${i})">Edit</button>
            </div>
        `;

        if(task.done) done++;

        list.appendChild(li);
    });

    document.getElementById("done").textContent = done;
    document.getElementById("undone").textContent = tasks.length - done;
}

function addTask(){
    const input = document.getElementById("taskInput");
    const text = input.value.trim();

    if(text === "") return;

    tasks.push({text: text, done: false});
    input.value = "";

    save();
    render();
}

function toggle(i){
    tasks[i].done = !tasks[i].done;
    save();
    render();
}

function remove(i){
    tasks.splice(i,1);
    save();
    render();
}

function edit(i){
    const newText = prompt("Edit task:", tasks[i].text);
    if(newText !== null){
        tasks[i].text = newText;
        save();
        render();
    }
}

/* Load */
render();

/* Back */
function goHome(){
    window.location.href = "index.html";
}
</script>

</body>
</html>
