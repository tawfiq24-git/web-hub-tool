<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Clock</title>

<style>
body {
    margin: 0;
    font-family: 'Courier New', monospace;
    background:white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Back */
.back {
    position: absolute;
    top: 20px;
    left: 20px;
    color: black;
    cursor: pointer;
}

/* Panel */
.clock-box {
    background: black;
    padding: 70px;
    border-radius: 20px;
    box-shadow: 0 0 20px #000;
    text-align: center;
}

/* Neon text */
.neon {
    color: #00ff66;
    text-shadow: 0 0 10px #00ff66;
}

/* Section */
.section {
    margin-bottom: 30px;
}

/* Labels */
.label {
    color: #aaa;
    font-size: 0.7rem;
    margin-bottom: 5px;
}

/* Row */
.row {
    display: flex;
    justify-content: space-around;
    gap: 15px;
}

/* Numbers */
.value {
    font-size: 1.5rem;
}

/* Time big */
.time {
    font-size: 2.5rem;
    margin: 15px 0;
}

/* Temperature */
.temp {
    font-size: 1.8rem;
    color: #00ff66;
}
</style>
</head>

<body>

<div class="back" onclick="goHome()">⬅ Home</div>


<div class="clock-box">

    <!-- Date -->
    <div class="section">
        <div class="row">
            <div>
                <div class="label">DATE</div>
                <div id="date" class="value neon"></div>
            </div>
            <div>
                <div class="label">MONTH</div>
                <div id="month" class="value neon"></div>
            </div>
            <div>
                <div class="label">YEAR</div>
                <div id="year" class="value neon"></div>
            </div>
        </div>
    </div>

    <!-- Time -->
    <div class="section">
        <div class="row">
            <div>
                <div class="label">HOUR</div>
            </div>
            <div>
                <div class="label">MINUTE</div>
            </div>
            <div>
                <div class="label">SECOND</div>
            </div>
        </div>

        <div id="time" class="time neon"></div>
    </div>

    <!-- Temperature -->
    <div class="section">
        <div class="label">TEMP</div>
        <div id="temp" class="temp">--°C</div>
    </div>

</div>

<script>
function updateClock(){
    const now = new Date();

    // Date
    document.getElementById("date").textContent = String(now.getDate()).padStart(2,'0');
    document.getElementById("month").textContent = String(now.getMonth()+1).padStart(2,'0');
    document.getElementById("year").textContent = now.getFullYear();

    // Time
    let h = String(now.getHours()).padStart(2,'0');
    let m = String(now.getMinutes()).padStart(2,'0');
    let s = String(now.getSeconds()).padStart(2,'0');

    document.getElementById("time").textContent = `${h}:${m}:${s}`;
}

/* Fake temperature (demo) */
function updateTemp(){
    let temp = Math.floor(25 + Math.random()*5);
    document.getElementById("temp").textContent = temp + "°C";
}

setInterval(updateClock, 1000);
setInterval(updateTemp, 5000);

updateClock();
updateTemp();

/* Back */
function goHome(){
    window.location.href = "index.html";
}
</script>

</body>
</html>
