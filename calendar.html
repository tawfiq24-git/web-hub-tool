<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar</title>

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#d9a7c7,#fffcdc);
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* Top bar */
.top{
    width:100%;
    display:flex;
    justify-content:space-between;
    padding:20px;
    font-size:1.2rem;
}

.back{
    cursor:pointer;
}

/* Heading */
h1{
    margin-top:10px;
}

/* Calendar container */
.calendar{
    width:90%;
    max-width:900px;
    background:white;
    border-radius:15px;
    padding:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

/* Header */
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.header button{
    padding:8px 12px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

/* Grid */
.days{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    text-align:center;
    margin-bottom:10px;
    font-weight:bold;
}

.dates{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:10px;
}

/* Date box */
.date{
    padding:15px;
    border-radius:10px;
    background:#f0f0f0;
    cursor:pointer;
}

/* Today highlight */
.today{
    background:#ff6b6b;
    color:white;
    font-weight:bold;
}

/* Empty */
.empty{
    background:transparent;
}
</style>
</head>

<body>

<div class="top">
    <div class="back" onclick="goHome()">⬅ Home</div>
    <div>📅 Calendarr</div>
</div>

<h1 id="monthYear"></h1>

<div class="calendar">

    <div class="header">
        <button onclick="changeMonth(-1)">⬅</button>
        <button onclick="changeMonth(1)">➡</button>
    </div>

    <div class="days">
        <div>Sun</div><div>Mon</div><div>Tue</div>
        <div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>

    <div id="dates" class="dates"></div>

</div>

<script>
let currentDate = new Date();

function renderCalendar(){
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById("monthYear").innerText =
        currentDate.toLocaleString("default",{month:"long",year:"numeric"});

    const firstDay = new Date(year,month,1).getDay();
    const lastDate = new Date(year,month+1,0).getDate();

    const dates = document.getElementById("dates");
    dates.innerHTML="";

    // empty boxes
    for(let i=0;i<firstDay;i++){
        dates.innerHTML += `<div class="date empty"></div>`;
    }

    // dates
    for(let d=1;d<=lastDate;d++){
        const isToday =
            d===new Date().getDate() &&
            month===new Date().getMonth() &&
            year===new Date().getFullYear();

        dates.innerHTML += `
            <div class="date ${isToday?"today":""}">
                ${d}
            </div>`;
    }
}

function changeMonth(val){
    currentDate.setMonth(currentDate.getMonth()+val);
    renderCalendar();
}

function goHome(){
    window.location.href="index.html";
}

renderCalendar();
</script>

</body>
</html>
