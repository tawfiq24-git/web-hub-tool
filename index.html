<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Tools Hub</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #000000);
    background-size: 400% 400%;
    animation: gradientMove 10s ease infinite;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

@keyframes gradientMove {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

.container {
    text-align: center;
    width: 100%;
    max-width: 900px;
}

/* Greeting */
#greeting {
    font-size: 2.5rem;
    margin-bottom: 10px;
}

/* Subtitle */
.subtitle {
    opacity: 0.8;
    margin-bottom: 15px;
}

/* Quote */
#quote {
    font-style: italic;
    margin-bottom: 35px;
}

/* GRID FIXED */
.cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

/* Card */
.card {
    padding: 35px;
    border-radius: 10px;
    cursor: pointer;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    transition: 0.4s;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

/* Hover */
.card:hover {
    transform: translateY(-10px) scale(1.05);
    box-shadow: 0 0 25px rgba(0,255,200,0.6);
}

/* Icon */
.icon {
    font-size: 2.5rem;
    margin-bottom: 10px;
}

/* Text */
.card h2 {
    font-size: 1.2rem;
}

/* Responsive */
@media(max-width: 700px){
    .cards {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 400px){
    .cards {
        grid-template-columns: 1fr;
    }
}
/* Default (dark) */
body.dark {
    background: linear-gradient(135deg, #0f2027, #203a43);
    color: white;
}

/* Light theme */
body.light {
    background: #f5f5f5;
    color: black;
}

/* Neon theme */
body.neon {
    background: black;
    color: #00ffcc;
}

/* Cards change */
body.light .card {
    background: rgba(0,0,0,0.05);
    color: black;
}

body.neon .card {
    background: rgba(0,255,200,0.1);
    box-shadow: 0 0 15px #00ffcc;
}

/* Theme switch style */
.theme-switch {
    position: absolute;
    top: 20px;
    right: 20px;
}

.theme-switch button {
    margin-left: 5px;
    padding: 5px 8px;
    border: none;
    cursor: pointer;
    border-radius: 5px;
}
</style>
</head>

<body>

<div class="container">
    <div class="theme-switch">
    <span>THEME</span>
    <button onclick="setTheme('dark')">1</button>
    <button onclick="setTheme('light')">2</button>
    <button onclick="setTheme('neon')">3</button>
</div>
    <div id="greeting"></div>
    <div class="subtitle">Welcome to your smart tools dashboard 🚀</div>
    <div id="quote"></div>

    <div class="cards">
        <div class="card" onclick="go('calculator.html')">
            <div class="icon">🧮</div>
            <h2>Digital Calculator</h2>
        </div>

        <div class="card" onclick="go('digitalclock.html')">
            <div class="icon">⏰</div>
            <h2>Digital Clock</h2>
        </div>

        <div class="card" onclick="go('todo.html')">
            <div class="icon">📋</div>
            <h2>To Do list</h2>
        </div>

        <div class="card" onclick="go('notesapp.html')">
            <div class="icon">📝</div>
            <h2>Notes App</h2>
        </div>

       
        <div class="card" onclick="go('calendar.html')">
    <div class="icon">📅</div>
    <h2>Calendar</h2>
</div>
    </div>
</div>

<script>
/* Greeting */
const greeting = document.getElementById("greeting");
const hour = new Date().getHours();

if(hour < 12) greeting.textContent = "🌅 Good Morning!";
else if(hour < 18) greeting.textContent = "☀️ Good Afternoon!";
else greeting.textContent = "🌙 Good Evening!";

/* Quotes */
const quotes = [
    "Stay focused and never give up 💪",
    "Small steps lead to big success 🚀",
    "Code. Learn. Build. Repeat 💻",
    "Your future depends on today ✨",
    "Dream big, work hard 🔥"
];

function changeQuote(){
    const q = quotes[Math.floor(Math.random()*quotes.length)];
    document.getElementById("quote").textContent = `"${q}"`;
}

changeQuote();
setInterval(changeQuote, 4000);

/* Navigation */
function go(page){
    window.location.href = page;
}

function setTheme(theme){
    document.body.className = theme;
    localStorage.setItem("theme", theme);
}

/* Load saved theme */
const savedTheme = localStorage.getItem("theme") || "dark";
document.body.className = savedTheme;

</script>

</body>
</html>
